spring.datasource.url=jdbc:mysql://localhost:3306/corefinancier
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=DEV_SECRET_KEY_CHANGE_IN_PROD_VERY_LONG_STRING_REQUIRED
jwt.expiration=3600000
logging.level.com.corefi=DEBUG
# Active l'exécution de data.sql APRÈS que Hibernate a créé les tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
